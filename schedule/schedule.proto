syntax = "proto3";

package schedule;

// On expose les opérations Create, Read et Delete des schedules.
service Schedule {
  // Retourne tous les schedules enregistrés.
  rpc GetSchedules(EmptyRequest) returns (SchedulesResponse);

  // Retourne le schedule associé à une date YYYYMMDD.
  rpc GetScheduleByDate(DateRequest) returns (ScheduleEntry);

  // Crée un schedule pour une date qui n'existe pas encore.
  rpc CreateSchedule(ScheduleEntry) returns (ScheduleEntry);

  // Supprime le schedule associé à une date.
  rpc DeleteSchedule(DateRequest) returns (DeleteScheduleResponse);
}

// Requête sans paramètre pour la lecture de tous les schedules.
message EmptyRequest {
}

// Date utilisée pour rechercher ou supprimer un schedule.
message DateRequest {
  string date = 1;
}

// Movies programmés pour une date YYYYMMDD.
message ScheduleEntry {
  string date = 1;
  repeated string movies = 2;
}

// Résultat de la lecture de tous les schedules.
message SchedulesResponse {
  repeated ScheduleEntry schedules = 1;
}

// Indique si une entrée a effectivement été supprimée.
message DeleteScheduleResponse {
  bool deleted = 1;
}